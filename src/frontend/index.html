<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jedi Data Archives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jedi Data Archives</h1>

    <div id="error-container" class="error"></div>
    <div id="success-container" class="success"></div>

    <section>
        <h2>Create New Character</h2>
        <form id="character-form" novalidate>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name">
            </div>
            <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="Jedi">Jedi</option>
                    <option value="Sith">Sith</option>
                    <option value="Rebel">Rebel</option>
                    <option value="Smuggler">Smuggler</option>
                </select>
            </div>
            <div class="form-group">
                <label for="planet">Planet:</label>
                <input type="text" id="planet" required>
            </div>
            <button type="submit">Create Character</button>
        </form>
    </section>

    <section>
        <h2>Character List</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Planet</th>
                </tr>
            </thead>
            <tbody id="character-table-body">
                <!-- Characters loaded via JS -->
            </tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
